<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMEs · Business Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{--bg:#0a0c10;--surface:#111318;--card:#161920;--border:#232730;--accent:#c8a96e;--accent2:#5c9eff;--accent3:#4ecb8a;--accent4:#e06b6b;--text:#e8e3d8;--muted:#7a7f8e;--font-display:'DM Serif Display',Georgia,serif;--font-body:'Manrope',sans-serif;--font-mono:'DM Mono',monospace;--radius:12px}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body)} #app{display:flex;flex-direction:column;min-height:100vh}
  header{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;border-bottom:1px solid var(--border);background:rgba(10,12,16,.9)} .logo-title{font-family:var(--font-display);color:var(--accent);font-size:24px}
  .header-right{display:flex;gap:10px;align-items:center}.btn{padding:8px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer}.btn-accent{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
  .dropdown{position:relative}.dropdown-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;min-width:220px}.dropdown.open .dropdown-menu{display:block}.dropdown-item{width:100%;text-align:left;background:transparent;color:var(--text);border:1px solid transparent;padding:9px;border-radius:8px;cursor:pointer}.dropdown-item:hover{border-color:var(--accent)}
  nav{display:flex;gap:4px;padding:0 32px;border-bottom:1px solid var(--border);background:var(--surface)} .tab{padding:12px 16px;cursor:pointer;color:var(--muted)} .tab.active{color:var(--accent);border-bottom:2px solid var(--accent)}
  main{max-width:1200px;margin:0 auto;width:100%;padding:24px}.page{display:none}.page.active{display:block}.page-title{font-family:var(--font-display);font-size:30px;color:var(--accent)} .page-sub{color:var(--muted);margin-bottom:18px}
  .return-link-wrap{margin:10px 0 14px}.back-link{color:var(--muted);text-decoration:none}.back-link:hover{color:var(--accent)}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}.kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase}.kpi-value{font-family:var(--font-mono);font-size:24px}
  table{width:100%;border-collapse:collapse} th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left}.td-mono{font-family:var(--font-mono)} .td-green{color:var(--accent3)} .td-red{color:var(--accent4)}
  .form-row{display:flex;gap:10px;flex-wrap:wrap}.form-group{display:flex;flex-direction:column;gap:5px;min-width:150px;flex:1} input,select{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px}
  #save-toast{position:fixed;right:20px;bottom:20px;background:var(--accent3);color:#000;padding:10px 14px;border-radius:8px;transform:translateY(80px);transition:.3s}#save-toast.show{transform:translateY(0)}
  .site-footer{margin-top:auto;border-top:1px solid var(--border);padding:18px 32px;color:var(--muted)} .footer-title{font-size:12px;color:var(--text);text-transform:uppercase}
  @media(max-width:900px){.grid-4{grid-template-columns:1fr 1fr}} @media(max-width:600px){.grid-4{grid-template-columns:1fr}main,header,nav{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo-title">SMEs</div>
    <div class="header-right">
      <span id="last-updated-label"></span>
      <div class="dropdown" id="header-actions">
        <button class="btn" id="header-actions-toggle">⋯</button>
        <div class="dropdown-menu">
          <button class="dropdown-item" onclick="exportData()">↓ Export</button>
          <button class="dropdown-item" onclick="exportEntityReport()">SMEs Report</button>
          <button class="dropdown-item" onclick="showPage('settings')">⚙️ Settings</button>
        </div>
      </div>
      <button class="btn btn-accent" onclick="saveAll()">Save</button>
    </div>
  </header>
  <nav>
    <div class="tab active" id="tab-dashboard" onclick="showPage('dashboard')">📊 Dashboard</div>
    <div class="tab" id="tab-portfolio" onclick="showPage('portfolio')">💼 Portfolio</div>
    <div class="tab" id="tab-cashflow" onclick="showPage('cashflow')">💸 Cashflow</div>
    <div class="tab" id="tab-tax" onclick="showPage('tax')">🧾 Tax</div>
    <div class="tab" id="tab-projections" onclick="showPage('projections')">📈 Projections</div>
    <div class="tab" id="tab-settings" onclick="showPage('settings')">⚙️ Settings</div>
  </nav>
  <main>
    <div class="page active" id="page-dashboard">
      <div class="return-link-wrap"><a class="back-link" href="index.html">← Hub</a></div>
      <div class="page-title">Overview</div><div class="page-sub">SME planning overview</div>
      <div class="grid-4" id="kpi-row"></div>
    </div>
    <div class="page" id="page-portfolio">
      <div class="page-title">Portfolio</div>
      <div class="card"><div class="form-row">
        <div class="form-group"><label>Asset</label><input id="p-name"></div>
        <div class="form-group"><label>Category</label><select id="p-cat"><option>Core</option><option>Growth</option><option>Cash</option><option>Debt</option></select></div>
        <div class="form-group"><label>Value</label><input id="p-value" type="number"></div>
        <div class="form-group"><label>Cost Base</label><input id="p-cost" type="number"></div>
        <div class="form-group"><label>&nbsp;</label><button class="btn btn-accent" onclick="addAsset()">+ Add</button></div>
      </div></div>
      <div class="card"><table><thead><tr><th>Asset</th><th>Category</th><th>Value</th><th>Cost Base</th><th>Gain</th><th>%</th></tr></thead><tbody id="portfolio-body"></tbody><tfoot id="portfolio-foot"></tfoot></table></div>
    </div>
    <div class="page" id="page-cashflow">
      <div class="page-title">Cashflow</div>
      <div class="card"><div class="form-row">
        <div class="form-group"><label>Monthly Income</label><input id="cf-income" type="number"></div>
        <div class="form-group"><label>Monthly Expenses</label><input id="cf-expenses" type="number"></div>
        <div class="form-group"><label>Debt Repayment</label><input id="cf-debt" type="number"></div>
        <div class="form-group"><label>Monthly Investing</label><input id="cf-invest" type="number"></div>
      </div></div>
    </div>
    <div class="page" id="page-tax">
      <div class="page-title">Tax</div>
      <div class="card"><div class="form-row">
        <div class="form-group"><label>Annual Income</label><input id="tax-income" type="number"></div>
        <div class="form-group"><label>Deductions</label><input id="tax-deductions" type="number"></div>
      </div></div>
    </div>
    <div class="page" id="page-projections"><div class="page-title">Projections</div><div class="card" id="proj-table"></div></div>
    <div class="page" id="page-settings">
      <div class="page-title">Settings</div>
      <div class="card"><div class="form-row">
        <div class="form-group"><label>Entity Name</label><input id="s-name"></div>
        <div class="form-group"><label>Target Balance</label><input id="s-target" type="number"></div>
        <div class="form-group"><label>Projection Years</label><input id="s-years" type="number"></div>
      </div></div>
    </div>
  </main>
  <div id="save-toast">Saved</div>
  <footer class="site-footer"><div class="footer-title">Related resources</div><div><a href="index.html">Hub</a> · <a href="wealth-builder.html">Individual</a> · <a href="smsf.html">Pension Fund</a></div></footer>
</div>
<script>window.ENTITY_CONFIG={appTitle:'SMEs',appSub:'Business Planning',storageKey:'entity_smes_v1',reportTitle:'SMEs Report',reportFilename:'smes-report'};</script>
<script src="assets/js/entity-planner.js"></script>
</body>
</html>

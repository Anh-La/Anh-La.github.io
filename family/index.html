    /* ── Design tokens ── */
    :root {
      --bg:       #0a0c10;
      --surface:  #111318;
      --card:     #141720;
      --border:   #1e2330;
      --border-hi:#2a3040;
      --accent:   #c8a96e;   /* gold  — personal / hub */
      --blue:     #5c9eff;   /* asset calculators */
      --green:    #4ecb8a;   /* family registry */
      --red:      #e06b6b;   /* tax & legal */
      --purple:   #b67fff;   /* nation state / macro */
      --orange:   #ff9f43;   /* global economy / business */
      --text:     #e8e3d8;
      --muted:    #6a7080;
      --font-display: 'DM Serif Display', Georgia, serif;
      --font-body:    'Be Vietnam Pro', system-ui, sans-serif;
      --font-mono:    'DM Mono', 'Courier New', monospace;
      --r: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.65;
      min-height: 100vh;
    }

    /* Subtle grain */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
      opacity: .5;
    }

    .shell {
      position: relative; z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 56px 24px 96px;
    }

    /* ── Header ── */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 56px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(28px, 4vw, 38px);
      color: var(--accent);
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 13px;
      max-width: 380px;
      line-height: 1.55;
    }

    .lang-btn {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 6px;
    }
    .lang-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Section labels ── */
    .section-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-label::before {
      content: '';
      display: inline-block;
      width: 20px; height: 1px;
      background: var(--accent);
      opacity: .6;
    }

    /* ── Project group ── */
    .project-group { margin-bottom: 48px; }

    /* ── Section label with carousel nav ── */
    .section-label { justify-content: space-between; }
    .section-label-text { display: flex; align-items: center; gap: 10px; }
    .section-label-text::before {
      content: '';
      display: inline-block;
      width: 20px; height: 1px;
      background: var(--accent);
      opacity: .6;
    }
    .section-label::before { display: none; }

    .carousel-nav { display: flex; gap: 6px; }
    .nav-btn {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border-hi);
      color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      transition: color .15s, border-color .15s;
    }
    .nav-btn:hover { color: var(--accent); border-color: var(--accent); }
    .nav-btn:active { transform: scale(.94); }

    /* ── Horizontal carousel track ── */
    .carousel-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      scroll-behavior: smooth;
      padding: 4px 4px 14px;
      margin: 0 -4px;
      -webkit-overflow-scrolling: touch;
    }
    .carousel-track::-webkit-scrollbar { height: 5px; }
    .carousel-track::-webkit-scrollbar-track { background: transparent; }
    .carousel-track::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }

    /* ── Project card (carousel item) ── */
    .project-card {
      flex: 0 0 252px;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      padding: 18px 18px 16px;
      transition: border-color .18s, transform .18s, box-shadow .18s;
      position: relative;
    }
    .project-card:hover {
      border-color: var(--border-hi);
      transform: translateY(-4px);
      box-shadow: 0 10px 26px rgba(0,0,0,.4);
    }

    /* Coloured top bar — the signature element */
    .project-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--c, var(--accent));
      opacity: .7;
      transition: opacity .18s;
    }
    .project-card:hover::before { opacity: 1; }

    .card-icon {
      width: 46px; height: 46px;
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      line-height: 1;
      background: color-mix(in srgb, var(--c, var(--accent)) 16%, transparent);
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .card-body { min-width: 0; flex: 1; display: flex; flex-direction: column; }

    .card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .card-tag {
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: .06em;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid;
      opacity: .75;
      font-weight: 400;
    }

    .card-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .card-features {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .card-features li {
      font-size: 10.5px;
      color: var(--muted);
      display: flex;
      gap: 6px;
      align-items: flex-start;
      line-height: 1.4;
    }
    .card-features li::before {
      content: '✓';
      color: var(--c, var(--accent));
      flex-shrink: 0;
      font-weight: 600;
      opacity: .85;
    }

    .card-arrow {
      margin-top: 12px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--c, var(--accent));
      display: flex;
      align-items: center;
      gap: 5px;
      opacity: .85;
      transition: gap .18s;
    }
    .project-card:hover .card-arrow { gap: 8px; opacity: 1; }

    /* ── Asset calculator carousel ── */
    .asset-tile {
      flex: 0 0 108px;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px 10px 14px;
      transition: border-color .18s, transform .18s;
    }
    .asset-tile:hover {
      border-color: var(--blue);
      transform: translateY(-3px);
    }
    .asset-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      line-height: 1;
      background: color-mix(in srgb, var(--blue) 16%, transparent);
    }
    .asset-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.3;
      transition: color .18s;
    }
    .asset-tile:hover .asset-name { color: var(--blue); }

    /* ── Footer ── */
    .site-footer {
      border-top: 1px solid var(--border);
      padding-top: 24px;
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .footer-note {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .footer-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }
    .footer-count span { color: var(--accent); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .shell { padding: 36px 16px 72px; }
      .site-header { margin-bottom: 40px; }
      .project-card { flex-basis: 220px; }
      .carousel-nav { display: none; }
    }
  </style>
</head>

    { icon: '🏦', href: 'assets-term-deposit',  name: { en: 'Term Deposit', vi: 'Tiền Kỳ Hạn' } },
    { icon: '📜', href: 'assets-bonds',         name: { en: 'Bonds',        vi: 'Trái Phiếu' } },
    { icon: '📈', href: 'assets-shares',        name: { en: 'Shares',       vi: 'Cổ Phiếu' } },
    { icon: '🔀', href: 'assets-derivatives',   name: { en: 'Derivatives',  vi: 'Phái Sinh' } },
    { icon: '🧺', href: 'assets-managed-funds', name: { en: 'Managed Funds',vi: 'Quỹ Quản Lý' } },
    { icon: '🏡', href: 'assets-property',      name: { en: 'Property',     vi: 'Bất Động Sản' } },
    { icon: '🧱', href: 'assets-metals',        name: { en: 'Metals',       vi: 'Kim Loại' } },
    { icon: '🪙', href: 'assets-crypto',        name: { en: 'Crypto',       vi: 'Tiền Mã Hóa' } },
    { icon: '🪙', href: 'Viet_digital_economy_framework_VI',        name: { en: 'Viet_digital_economy_framework',       vi: 'Viet_digital_economy_framework' } },
  ];

  /* ── Render ── */
  function render() {
    // i18n static elements
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (T[lang][key]) el.textContent = T[lang][key];
    });

    // App carousel
    const listEl = document.getElementById('list-apps');
    listEl.innerHTML = '';
    APPS.forEach(app => {
      const a = document.createElement('a');
      a.href = app.href;
      a.className = 'project-card';
      a.style.setProperty('--c', app.color);
      const featureItems = app.features[lang].map(f => `<li>${f}</li>`).join('');
      a.innerHTML = `
        <span class="card-icon">${app.icon}</span>
        <div class="card-body">
          <div class="card-name">
            ${app.name[lang]}
          </div>
          <div class="card-desc">${app.desc[lang]}</div>
          <ul class="card-features">${featureItems}</ul>
          <span class="card-arrow">${lang === 'en' ? 'Open' : 'Mở'} →</span>
        </div>
      `;
      listEl.appendChild(a);
    });

    // Asset carousel
    const gridEl = document.getElementById('grid-assets');
    gridEl.innerHTML = '';
    ASSETS.forEach(asset => {
      const a = document.createElement('a');
      a.href = asset.href;
      a.className = 'asset-tile';
      a.innerHTML = `
        <span class="asset-icon">${asset.icon}</span>
        <span class="asset-name">${asset.name[lang]}</span>
      `;
      gridEl.appendChild(a);
    });

    // Footer count
    const fc = document.getElementById('footer-count');
    fc.textContent = T[lang].footerCount(APPS.length, ASSETS.length);
  }

  function scrollCarousel(id, dir) {
    const el = document.getElementById(id);
    el.scrollBy({ left: dir * el.clientWidth * 0.85, behavior: 'smooth' });
  }

  function toggleLang() {
    lang = lang === 'en' ? 'vi' : 'en';
    render();
  }

  render();

  /* ── PWA: register service worker ── */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then((registration) => {
          // A tab open when the service worker first installs is NOT
          // controlled by it — this page and its sub-resources (fonts,
          // icons) would bypass the cache for this whole session. If
          // someone goes offline right after first install, before ever
          // reloading, nothing was cached in time. So: on the very first
          // install, reload once (guarded by sessionStorage) after the new
          // worker activates, so this visit gets fully captured offline.
          if (!navigator.serviceWorker.controller) {
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (
                  newWorker.state === 'activated' &&
                  !sessionStorage.getItem('ffSwReloaded')
                ) {
                  sessionStorage.setItem('ffSwReloaded', '1');
                  window.location.reload();
                }
              });
            });
          }
        })
        .catch((err) => {
          console.warn('Service worker registration failed:', err);
        });
    });
  }
</script>

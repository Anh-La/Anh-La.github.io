let currentLang = 'en';

// ═══════════════════════════════════════════════════════════
//  LANGUAGE FUNCTIONS
// ═══════════════════════════════════════════════════════════
function switchLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('wealthbuilder_lang', lang);
  document.documentElement.lang = lang === 'vi' ? 'vi' : 'en';
  
  // Update static texts
  document.getElementById('logo-sub').textContent = i18n[lang].logoSub;
  document.querySelectorAll('.tab').forEach(tab => {
    const key = tab.id.replace('tab-', '');
    if (i18n[lang][key]) tab.textContent = i18n[lang][key];
  });

  refreshAll();
}

function getLang() {
  return localStorage.getItem('wealthbuilder_lang') || 'en';
}

// ═══════════════════════════════════════════════════════════
//  Rest of your existing script (STATE, LOAD/SAVE, etc.)
// ═══════════════════════════════════════════════════════════
const DEFAULT_STATE = { /* ... same as before ... */ };

let S = JSON.parse(JSON.stringify(DEFAULT_STATE));
let donutChart = null, cashflowBarChart = null, debtChartInst = null, retirementChartInst = null, projChartInst = null;

// Load language
currentLang = getLang();
document.getElementById('lang-select').value = currentLang;

// Update loadState to also load language
function loadState() {
  try {
    const raw = localStorage.getItem('wealthbuilder_v2');
    if (raw) S = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), JSON.parse(raw));
    currentLang = getLang();
  } catch(e) {}
}

// Update saveAll, render functions, etc. to respect language
function updateLastUpdated() {
  const el = document.getElementById('last-updated-label');
  if (S.lastUpdated) {
    const d = new Date(S.lastUpdated);
    el.textContent = currentLang === 'vi' 
      ? 'Đã lưu ' + d.toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' })
      : 'Saved ' + d.toLocaleString('en-AU', { dateStyle: 'short', timeStyle: 'short' });
  }
}

// Example: Update renderDashboard with bilingual support
function renderDashboard() {
  // ... existing logic ...
  
  document.getElementById('fi-years-left').textContent = fiYearsLeft;
  document.querySelector('.fi-label').textContent = currentLang === 'vi' 
    ? `năm đến mục tiêu FI (tuổi ${S.settings.fiAge})` 
    : `years to FI target (age ${S.settings.fiAge})`;
  
  // ... rest of the function
}

// Initialize
loadState();
document.getElementById('lang-select').value = currentLang;
updateLastUpdated();
populateForms();
renderDashboard();

// Auto language switch on load
switchLanguage(currentLang);

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* ── Design tokens ── */
    :root {
      --bg:       #0a0c10;
      --surface:  #111318;
      --card:     #141720;
      --border:   #1e2330;
      --border-hi:#2a3040;
      --accent:   #c8a96e;   /* gold  — personal / hub */
      --blue:     #5c9eff;   /* asset calculators */
      --green:    #4ecb8a;   /* family registry */
      --red:      #e06b6b;   /* tax & legal */
      --purple:   #b67fff;   /* nation state */
      --orange:   #ff9f43;   /* global economy / business */
      --text:     #e8e3d8;
      --muted:    #6a7080;
      --font-display: 'DM Serif Display', Georgia, serif;
      --font-body:    'Be Vietnam Pro', system-ui, sans-serif;
      --font-mono:    'DM Mono', 'Courier New', monospace;
      --r: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.65;
      min-height: 100vh;
    }

    /* Subtle grain */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
      opacity: .5;
    }

    .shell {
      position: relative; z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 56px 24px 96px;
    }

    /* ── Header ── */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 56px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(28px, 4vw, 38px);
      color: var(--accent);
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 13px;
      max-width: 380px;
      line-height: 1.55;
    }

    .lang-btn {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 6px;
    }
    .lang-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Section labels ── */
    .section-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-label::before {
      content: '';
      display: inline-block;
      width: 20px; height: 1px;
      background: var(--accent);
      opacity: .6;
    }

    /* ── Project group ── */
    .project-group { margin-bottom: 48px; }

    /* ── Project card ── */
    .project-list { display: flex; flex-direction: column; gap: 2px; }

    .project-card {
      display: flex;
      align-items: center;
      gap: 0;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      transition: border-color .18s, transform .18s, box-shadow .18s;
      position: relative;
    }
    .project-card:hover {
      border-color: var(--border-hi);
      transform: translateX(3px);
      box-shadow: 0 4px 20px rgba(0,0,0,.35);
    }

    /* Coloured left bar — the signature element */
    .project-card::before {
      content: '';
      display: block;
      width: 3px;
      align-self: stretch;
      background: var(--c, var(--accent));
      flex-shrink: 0;
      opacity: .7;
      transition: opacity .18s;
    }
    .project-card:hover::before { opacity: 1; }

    .card-icon {
      font-size: 20px;
      padding: 0 18px;
      line-height: 1;
      flex-shrink: 0;
    }

    .card-body {
      flex: 1;
      padding: 16px 16px 16px 0;
      min-width: 0;
    }

    .card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card-tag {
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: .06em;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid;
      opacity: .75;
      font-weight: 400;
    }

    .card-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.45;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-arrow {
      font-size: 13px;
      color: var(--muted);
      padding: 0 18px 0 12px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity .18s, transform .18s;
    }
    .project-card:hover .card-arrow { opacity: 1; transform: translateX(3px); }

    /* ── Asset calculator grid ── */
    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }

    .asset-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px 10px 14px;
      transition: border-color .18s, transform .18s;
    }
    .asset-tile:hover {
      border-color: var(--blue);
      transform: translateY(-2px);
    }
    .asset-tile::before {
      content: '';
      display: block;
      width: 28px; height: 2px;
      background: var(--blue);
      border-radius: 2px;
      opacity: 0;
      transition: opacity .18s;
    }
    .asset-tile:hover::before { opacity: 1; }

    .asset-icon { font-size: 22px; line-height: 1; }
    .asset-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.3;
      transition: color .18s;
    }
    .asset-tile:hover .asset-name { color: var(--blue); }

    /* ── Footer ── */
    .site-footer {
      border-top: 1px solid var(--border);
      padding-top: 24px;
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .footer-note {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .footer-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }
    .footer-count span { color: var(--accent); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .shell { padding: 36px 16px 72px; }
      .site-header { margin-bottom: 40px; }
      .card-desc { display: none; }
      .asset-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- HEADER -->
  <header class="site-header">
    <div>
      <h1 class="brand-title" data-i18n="title">Finance &amp; Family</h1>
      <p class="brand-sub" data-i18n="sub">A personal suite of financial tools for families. Select a project to open it.</p>
    </div>
    <button class="lang-btn" onclick="toggleLang()" data-i18n="langBtn">🌐 Tiếng Việt</button>
  </header>

  <!-- SECTION 1 — MAIN APPS -->
  <div class="project-group" id="group-apps">
    <div class="section-label" data-i18n="labelApps">Applications</div>
    <div class="project-list" id="list-apps"></div>
  </div>

  <!-- SECTION 2 — ASSET CALCULATORS -->
  <div class="project-group" id="group-assets">
    <div class="section-label" data-i18n="labelAssets">Asset Class Calculators</div>
    <div class="asset-grid" id="grid-assets"></div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <span class="footer-note" data-i18n="footerNote">All tools run locally · No data leaves your browser</span>
    <span class="footer-count" id="footer-count"></span>
  </footer>

</div>

<script>
  /* ── i18n ── */
  let lang = 'en';

  const T = {
    en: {
      title:       'Finance & Family',
      sub:         'A personal suite of financial tools and family records. Select a project to open it.',
      langBtn:     '🌐 Tiếng Việt',
      labelApps:   'Applications',
      labelAssets: 'Asset Class Calculators',
      footerNote:  'All tools run locally · No data leaves your browser',
      footerCount: (n, m) => `${n} apps · ${m} calculators`,
    },
    vi: {
      title:       'Tài Chính & Gia Đình',
      sub:         'Bộ công cụ tài chính và hồ sơ gia đình cá nhân. Chọn một dự án để mở.',
      langBtn:     '🌐 English',
      labelApps:   'Ứng Dụng',
      labelAssets: 'Máy Tính Từng Loại Tài Sản',
      footerNote:  'Tất cả công cụ chạy cục bộ · Không có dữ liệu rời khỏi trình duyệt',
      footerCount: (n, m) => `${n} ứng dụng · ${m} máy tính`,
    }
  };

  /* ── Project data ── */
  const APPS = [
    {
      icon: '💼',
      color: '#c8a96e',
      href: 'wealth-builder',
      tag: { en: 'Personal',  vi: 'Cá Nhân' },
      name: { en: 'Personal Wealth Builder',   vi: 'Quản Lý Tài Sản Cá Nhân' },
      desc: { en: 'Cashflow, budget, tax, debt & net worth tracker',
              vi: 'Theo dõi dòng tiền, ngân sách, thuế, nợ & giá trị tài sản ròng' },
      tagColor: '#c8a96e',
    },
    {
      icon: '🏛️',
      color: '#4ecb8a',
      href: 'family',
      tag: { en: 'Genealogy', vi: 'Gia Phả' },
      name: { en: 'Lã Family Registry',        vi: 'Gia Phả Họ Lã' },
      desc: { en: 'Family tree, demographics, kinship records & statistics across generations',
              vi: 'Cây gia phả, nhân khẩu học, hồ sơ thân tộc & thống kê qua các thế hệ' },
      tagColor: '#4ecb8a',
    },
    {
      icon: '📊',
      color: '#ff9f43',
      href: 'smes',
      tag: { en: 'Business',  vi: 'Doanh Nghiệp' },
      name: { en: 'Small Business Finance',    vi: 'Tài Chính Doanh Nghiệp Nhỏ' },
      desc: { en: 'Cashflow, tax planning & financial statements for SMEs',
              vi: 'Dòng tiền, kế hoạch thuế & báo cáo tài chính cho doanh nghiệp vừa và nhỏ' },
      tagColor: '#ff9f43',
    },
    {
      icon: '🏦',
      color: '#c8a96e',
      href: 'smsf',
      tag: { en: 'Super',     vi: 'Hưu Bổng' },
      name: { en: 'SMSF Dashboard',            vi: 'Bảng Điều Khiển SMSF' },
      desc: { en: 'Self-managed super fund compliance, contributions & performance',
              vi: 'Tuân thủ, đóng góp & hiệu suất quỹ hưu bổng tự quản' },
      tagColor: '#c8a96e',
    },
    {
      icon: '🌐',
      color: '#b67fff',
      href: 'nation-state',
      tag: { en: 'Macro',     vi: 'Vĩ Mô' },
      name: { en: 'Nation State Simulator',    vi: 'Mô Phỏng Quốc Gia' },
      desc: { en: 'Fiscal & monetary policy simulator — budgets, rates & economic levers',
              vi: 'Trình giả lập chính sách tài khóa & tiền tệ — ngân sách, lãi suất & đòn bẩy kinh tế' },
      tagColor: '#b67fff',
    },
    {
      icon: '🌍',
      color: '#ff9f43',
      href: 'earth-economy',
      tag: { en: 'Global',    vi: 'Toàn Cầu' },
      name: { en: 'Global Economy Observatory', vi: 'Đài Quan Sát Kinh Tế Toàn Cầu' },
      desc: { en: 'Macroeconomic map — GDP, trade flows & inflation by region',
              vi: 'Bản đồ kinh tế vĩ mô — GDP, dòng thương mại & lạm phát theo khu vực' },
      tagColor: '#ff9f43',
    },
    {
      icon: '⚖️',
      color: '#e06b6b',
      href: 'international_tax_framework',
      tag: { en: 'Tax',       vi: 'Thuế' },
      name: { en: 'International Tax', vi: 'Thuế Quốc Tế' },
      desc: { en: 'Tax issues: residency, PE risk, WHT, transfer pricing, post-acquisition structure',
              vi: 'Vấn đề thuế: cư trú thuế, rủi ro PE, WHT, định giá chuyển nhượng, cơ cấu hậu thâu tóm' },
      tagColor: '#e06b6b',
    },
  ];

  const ASSETS = [
    { icon: '💵', href: 'assets-cash',          name: { en: 'Cash',         vi: 'Tiền Mặt' } },
    { icon: '🏦', href: 'assets-term-deposit',  name: { en: 'Term Deposit', vi: 'Tiền Kỳ Hạn' } },
    { icon: '📜', href: 'assets-bonds',         name: { en: 'Bonds',        vi: 'Trái Phiếu' } },
    { icon: '📈', href: 'assets-shares',        name: { en: 'Shares',       vi: 'Cổ Phiếu' } },
    { icon: '🔀', href: 'assets-derivatives',   name: { en: 'Derivatives',  vi: 'Phái Sinh' } },
    { icon: '🧺', href: 'assets-managed-funds', name: { en: 'Managed Funds',vi: 'Quỹ Quản Lý' } },
    { icon: '🏡', href: 'assets-property',      name: { en: 'Property',     vi: 'Bất Động Sản' } },
    { icon: '🧱', href: 'assets-metals',        name: { en: 'Metals',       vi: 'Kim Loại' } },
    { icon: '🪙', href: 'assets-crypto',        name: { en: 'Crypto',       vi: 'Tiền Mã Hóa' } },
  ];

  /* ── Render ── */
  function render() {
    // i18n static elements
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (T[lang][key]) el.textContent = T[lang][key];
    });

    // App list
    const listEl = document.getElementById('list-apps');
    listEl.innerHTML = '';
    APPS.forEach(app => {
      const a = document.createElement('a');
      a.href = app.href;
      a.className = 'project-card';
      a.style.setProperty('--c', app.color);
      a.innerHTML = `
        <span class="card-icon">${app.icon}</span>
        <div class="card-body">
          <div class="card-name">
            ${app.name[lang]}
            <span class="card-tag" style="color:${app.tagColor};border-color:${app.tagColor}40;background:${app.tagColor}10">${app.tag[lang]}</span>
          </div>
          <div class="card-desc">${app.desc[lang]}</div>
        </div>
        <span class="card-arrow">→</span>
      `;
      listEl.appendChild(a);
    });

    // Asset grid
    const gridEl = document.getElementById('grid-assets');
    gridEl.innerHTML = '';
    ASSETS.forEach(asset => {
      const a = document.createElement('a');
      a.href = asset.href;
      a.className = 'asset-tile';
      a.innerHTML = `
        <span class="asset-icon">${asset.icon}</span>
        <span class="asset-name">${asset.name[lang]}</span>
      `;
      gridEl.appendChild(a);
    });

    // Footer count
    const fc = document.getElementById('footer-count');
    fc.textContent = T[lang].footerCount(APPS.length, ASSETS.length);
  }

  function toggleLang() {
    lang = lang === 'en' ? 'vi' : 'en';
    render();
  }

  render();
</script>
</body>
</html>
